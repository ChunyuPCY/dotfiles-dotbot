- plugins:
    - dotbot-age

- decrypt: true

- defaults:
    link:
      create: true
      force: true
      relink: true

- clean: ["~"]

- link:
    ~/.config/starship: ./starship
    ~/.config/nvim-minimax: ./nvim-minimax
    ~/.config/lazyvim: ./lazyvim
    ~/.config/nvim: ./nvim
    ~/.config/eza: ./eza
    ~/.config/bat: ./bat
    ~/.config/bottom: ./bottom
    ~/.config/wezterm: ./wezterm
    ~/.config/ghostty: ./ghostty
    ~/.config/zellij: ./zellij
    ~/.config/fastfetch: ./fastfetch
    ~/.config/yazi: ./yazi
    ~/.config/lazygit: ./lazygit
    ~/.config/tmux: ./tmux
    ~/.config/herdr/config.toml: ./herdr/config.toml
    ~/.config/herdr/session.json: ./herdr/session.json

    # fish
    ~/.config/fish: ./fish
    ~/.config/fish/private/api-key.fish: private/fish/api-key.fish

    # VS Code Linux
    ~/.config/Code/User:
      if: "[[ `uname` = Linux ]]"
      glob: true
      path: vscode/linux/*.json
      force: true

    # VS Code MacOS
    ~/Library/Application Support/Code/User:
      if: "[ `uname` = Darwin ]"
      glob: true
      path: vscode/macos/*.json
      force: true
    ~/Library/Application Support/Code/User/snippets:
      if: "[ `uname` = Darwin ]"
      path: vscode/snippets
      force: true

- shell:
    - git submodule sync --recursive
    - git submodule update --init --recursive --remote
